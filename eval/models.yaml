# Models for eval/run_model_comparison.py.
# Prices: USD per 1M tokens, standard tier, checked 2026-10-22
#   OpenAI:    https://developers.openai.com/api/docs/pricing
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
# web_search: whether the provider's built-in web search is used for this model in `web` mode.
# params: per-model request parameters. Only what is set here is sent; temperature is left at each
# model's default everywhere (the gpt-5 family and Claude Haiku/Sonnet 5.5 reject non-default values).

defaults:
  max_output_tokens: 8000      # same for every model; includes reasoning / thinking tokens
  web_max_searches: 5          # cap per question (OpenAI max_tool_calls, Anthropic max_uses)
  top_k: 20                    # snippets in the posts context
  concurrency: 3
  db_name: News

web_search_price_per_1k:
  openai: 10.00                # "web_search" tool, all models; search content billed as input tokens
  anthropic: 10.00             # plus standard token costs for search results

# Fixed profile for the personalization question (q17); the same for every model.
test_user_profile: "Тестовий профіль користувача. Ціль: знайти перспективні напрямки для інвестицій у defense tech."

models:
  - name: gpt-5-nano
    provider: openai
    model: gpt-5-nano
    enabled: true
    price_input_per_1m: 0.05
    price_output_per_1m: 0.40
    web_search: true
    params: {reasoning_effort: medium}   # web search does not work with "minimal"

  - name: gpt-5-mini
    provider: openai
    model: gpt-5-mini
    enabled: true
    price_input_per_1m: 0.25
    price_output_per_1m: 2.00
    web_search: true
    params: {reasoning_effort: medium}

  - name: gpt-4.1-mini
    provider: openai
    model: gpt-4.1-mini
    enabled: true
    price_input_per_1m: 0.40
    price_output_per_1m: 1.60
    web_search: true
    # OpenAI bills web search content for gpt-4.1-mini as a fixed 8,000 input tokens per call
    # (already included in usage.input_tokens; used only for the cost estimate).
    web_search_fixed_input_tokens_per_call: 8000
    params: {}

  - name: claude-haiku-5-5
    provider: anthropic
    model: claude-haiku-5-5
    enabled: true
    price_input_per_1m: 0.10       # prompts up to 100K tokens ($0.50 / $2.50 beyond)
    price_output_per_1m: 0.50
    web_search: true
    params: {effort: medium}       # thinking is adaptive by default; effort default is medium

